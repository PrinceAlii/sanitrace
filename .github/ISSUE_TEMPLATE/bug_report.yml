name: Bug report
description: Report a parsing or rendering problem.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Use a synthetic session to reproduce the problem.
        Do not paste a real session log or diagnostic output.

        Report suspected leaks and other vulnerabilities through
        [private vulnerability reporting](https://github.com/PrinceAlii/sanitrace/security/advisories/new).
        See the [security policy](https://github.com/PrinceAlii/sanitrace/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did sanitrace do, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Synthetic reproduction
      description: Include synthetic input and the relevant output. Remove private paths and identifiers.
      render: markdown
  - type: input
    id: version
    attributes:
      label: sanitrace version
      placeholder: output of `sanitrace --version`
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version and OS
      placeholder: node 22.11.0, macOS 15.2
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: The report still reproduces on the latest release.
          required: true
        - label: The reproduction contains only synthetic data and no private information.
          required: true
