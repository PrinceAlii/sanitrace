name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run lint

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm pack --dry-run

  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Render the fixture
        run: node bin/sanitrace.js test/fixtures/codex-rollout.jsonl --json -o report.json
      - name: No residual secrets and no raw home path
        run: |
          node -e "
            const report = require('./report.json');
            if (report.residual.length) { console.error(report.residual); process.exit(1); }
            if (report.markdown.includes('/Users/')) { console.error('home path leaked'); process.exit(1); }
          "
